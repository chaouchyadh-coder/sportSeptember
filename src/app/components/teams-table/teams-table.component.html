  <table class="table">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Name</th>
      <th scope="col">Owner</th>
      <th scope="col">Foundation</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let team of teamsTab ">
      <td>{{team.id}}</td>
      <td >{{team.name}}</td>
      <td>{{team.owner}}</td>
      <td>{{team.foundation}}</td>
    </tr>
    
  </tbody>
</table>
