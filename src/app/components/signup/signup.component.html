<div class="hero overlay" style="background-image: url('images/bg_3.jpg');">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-9 mx-auto text-center">
        <h1 class="text-white">Signup</h1>
      </div>
    </div>
  </div>
</div>


<div class="site-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-7">
        <form [formGroup]="signupForm">

          <div class="form-group">
            <input type="text" class="form-control" placeholder="First Name" formControlName="firstName">
          </div>
          <div class="text-danger" *ngIf="signupForm.controls['firstName'].invalid &&
              (signupForm.controls['firstName'].touched||signupForm.controls['firstName'].dirty) ">
            <div *ngIf="signupForm.controls['firstName'].errors?.['required'] ">
              FirstName is required
            </div>
            <div *ngIf="signupForm.controls['firstName'].errors?.['minlength']">
              FirstName must have at least 3 charactéres
            </div>
          </div>
          <div class=" form-group">
            <input type="password" class="form-control" placeholder="Last Name" formControlName="lastName">
          </div>
          <div class="text-danger" *ngIf="signupForm.controls['lastName'].invalid &&
              (signupForm.controls['lastName'].touched||signupForm.controls['lastName'].dirty) ">

            <div *ngIf="signupForm.controls['lastName'].errors?.['required'] ">
              lastName is required
            </div>
            <div *ngIf="signupForm.controls['lastName'].errors?.['minlength']">
              lastName must have at least 5 charactéres
            </div>

          </div>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Email" formControlName="email">
          </div>

          <div class="text-danger" *ngIf="signupForm.controls['email'].invalid &&
              (signupForm.controls['email'].touched||signupForm.controls['email'].dirty) ">

            <div *ngIf="signupForm.controls['email'].errors?.['required'] ">
              email is required
            </div>
            <div *ngIf="signupForm.controls['email'].errors?.['email']">
               invalid email format
            </div>

          </div>

          <div class="form-group">
            <input type="password" class="form-control" placeholder="password" formControlName="pwd">
          </div>
          <div class="text-danger" *ngIf="signupForm.controls['pwd'].invalid &&
              (signupForm.controls['pwd'].touched||signupForm.controls['pwd'].dirty) ">

           <div *ngIf="signupForm.controls['pwd'].errors?.['required'] ">
             pwd is required

           </div>
            <div *ngIf="signupForm.controls['pwd'].errors?.['minlength']">
             pwd must have at least 4 charactéres 

            </div>
            <div *ngIf="signupForm.controls['pwd'].errors?.['maxlength']">
             pwd must have at least 8 charactéres 

            </div>

          </div>

          <div class="form-group">
            <input type="submit" (click)="signup()" class="btn btn-primary py-3 px-5" value="Signup">
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
