<div class="hero overlay" style="background-image: url('images/bg_3.jpg');">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-9 mx-auto text-center">
        <h1 class="text-white">Addmatch</h1>
      </div>
    </div>
  </div>
</div>


<div class="site-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-7">
        <!-- matchform :identifiant de notre formulaire (id de formulaire) -->
        <form #matchform="ngForm">

          <div class="form-group">
            <input type="number" name="s1" class="form-control" placeholder="score One" [(ngModel)]="match.scoreOne">
          </div>
          <div class="form-group">
            <input type="number" name="s2" class="form-control" placeholder="score Two" [(ngModel)]="match.scoreTwo">
          </div>
          <div class="form-group">
            <input type="text" name="t1" class="form-control" placeholder="Team One" [(ngModel)]="match.TeamOne">
          </div>
          <div class="form-group">
            <input type="text" name="t2" class="form-control" placeholder="Team Two" [(ngModel)]="match.TeamTwo">
          </div>

          <div class="form-group">
            <input type="submit" (click)="addMatch()" class="btn btn-primary py-3 px-5" value="Add Match">
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
