
<div class="hero overlay" style="background-image: url('images/bg_3.jpg');">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-9 mx-auto text-center">
            <h1 class="text-white">Addplayer</h1>
          </div>
        </div>
      </div>
    </div>

    
    <div class="site-section">
      <div class="container">
        <div class="row">
          <div class="col-lg-7">
            <form #playerform="ngForm">
             
              <div class="form-group">
                <input type="text" name="n1" class="form-control" placeholder="Name" [(ngModel)]="player.name">
              </div>
              <div class="form-group">
                <input type="number" name="ag1"  class="form-control" placeholder="Age" [(ngModel)]="player.age">
              </div>
              <div class="form-group">
                <input type="text" name="pos1" class="form-control" placeholder="position" [(ngModel)]="player.position">
              </div>
              <div class="form-group">
                <input type="number" name="nbr1" class="form-control" placeholder="NBR" [(ngModel)]="player.nombre">
              </div>
             
              <div class="form-group">
                <input type="submit" (click)="addPlayer()" class="btn btn-primary py-3 px-5" value="Add Player">
              </div>
            </form>  
          </div>
          
        </div>
      </div>
    </div>
