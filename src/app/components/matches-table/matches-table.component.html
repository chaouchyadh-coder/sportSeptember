<table class="table">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">score one</th>
      <th scope="col">score two</th>
      <th scope="col">Team one</th>
      <th scope="col">Team two</th>
      <th scope="col">Result</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let obj of matchesTab">
      <td> {{obj.id}}</td>
      <td [ngStyle]="{color:scoreColor(obj.scoreOne,obj.scoreTwo)}">{{obj.scoreOne}} </td>
      <td [ngStyle]="{color:scoreColor(obj.scoreTwo,obj.scoreOne)}">{{obj.scoreTwo}} </td>
      <td [ngStyle]="{color:scoreColor(obj.scoreOne,obj.scoreTwo)}">{{obj.teamOne}} </td>
      <td [ngStyle]="{color:scoreColor(obj.scoreTwo,obj.scoreOne)}">{{obj.teamTwo}} </td>
      <td [ngStyle]="{color:scoreColor(obj.scoreOne,obj.scoreTwo)}" >
        {{scoreResult(obj.scoreOne,obj.scoreTwo,obj.teamOne)}} 
      </td>
    </tr>

  </tbody>
</table>
