
<div class="hero overlay" style="background-image: url('images/bg_3.jpg');">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-9 mx-auto text-center">
            <h1 class="text-white">Add Team</h1>
          </div>
        </div>
      </div>
    </div>

    
    <div class="site-section">
      <div class="container">
        <div class="row">
          <div class="col-lg-7">
            <form #teamform="ngForm">
             
              <div class="form-group">
                <input type="text" name="n1" class="form-control" placeholder="Name" [(ngModel)]="team.name" >
              </div>
              
              <div class="form-group">
                <input type="text" name="o1" class="form-control" placeholder="Owner" [(ngModel)]="team.Owner" >
              </div>
              <div class="form-group">
                <input type="number" name="f1" class="form-control" placeholder="Fondation Year" [(ngModel)]="team.Fondation" >
              </div>
             
              <div class="form-group">
                <input type="submit" (click)="addTeam()" class="btn btn-primary py-3 px-5" value="Add Team">
              </div>
            </form>  
          </div>
          
        </div>
      </div>
    </div>
